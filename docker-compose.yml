services:
  postgres:
    image: postgres:16-alpine
    container_name: orientacion-postgres
    environment:
      POSTGRES_USER: orientacion
      POSTGRES_PASSWORD: orientacion
      POSTGRES_DB: orientacion
    ports:
      - "5432:5432"
    volumes:
      - orientacion-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orientacion -d orientacion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orientacion-postgres:
